      <stop offset="0" stop-color="#d3d9e4"/>
      <stop offset="1" stop-color="#9aa4bb"/>
    </linearGradient>
    <linearGradient id="tg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcc4d4"/>
      <stop offset="1" stop-color="#7e8aa6"/>
    </linearGradient>
    <pattern id="powder" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#5f6b85"/>
      <circle cx="22" cy="24" r="16" fill="url(#tg1)"/>
      <circle cx="60" cy="18" r="12" fill="url(#tg2)"/>
      <circle cx="48" cy="52" r="18" fill="url(#tg1)"/>
      <circle cx="12" cy="62" r="13" fill="url(#tg2)"/>
      <circle cx="78" cy="70" r="14" fill="url(#tg1)"/>
      <circle cx="20" cy="20" r="3.2" fill="#333d55"/>
      <circle cx="62" cy="16" r="2.4" fill="#333d55"/>
      <circle cx="50" cy="55" r="3.8" fill="#333d55"/>
      <circle cx="14" cy="64" r="2.6" fill="#333d55"/>
      <circle cx="80" cy="72" r="3" fill="#333d55"/>
      <circle cx="70" cy="38" r="1.8" fill="#29324a"/>
      <circle cx="34" cy="70" r="1.6" fill="#29324a"/>
      <circle cx="36" cy="40" r="1.5" fill="#29324a"/>

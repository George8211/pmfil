      <circle cx="22" cy="24" r="16" fill="url(#pg1)"/>
      <circle cx="60" cy="18" r="12" fill="url(#pg2)"/>
      <circle cx="48" cy="52" r="18" fill="url(#pg1)"/>
      <circle cx="12" cy="62" r="13" fill="url(#pg2)"/>
